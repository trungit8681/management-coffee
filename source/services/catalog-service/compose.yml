name: coffee-catalog
services:
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog_app
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-admin1234}
    ports:
      - "${CATALOG_DB_PORT:-5437}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_app -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CATALOG_DB_URL: "postgresql://catalog_app:${CATALOG_DB_PASSWORD:-admin1234}@catalog-db:5432/catalog"
      CATALOG_JWKS_URI: ${CATALOG_DOCKER_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      PORT: 8080
    ports:
      - "${CATALOG_SERVICE_PORT:-8082}:8080"
    depends_on:
      catalog-db:
        condition: service_healthy
    # Nếu muốn bật healthcheck cho service này thì bỏ comment:
    # healthcheck:
    #   test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 10
    #   start_period: 30s
    restart: unless-stopped

volumes:
  catalog_db_data:
    name: coffee_catalog_standalone_db_data
