name: coffee-inventory
services:
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-admin1234}
    ports: ["${INVENTORY_DB_PORT:-5440}:5432"]
    volumes: [inventory_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  inventory-service:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      INVENTORY_DB_USERNAME: inventory_app
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-admin1234}
      INVENTORY_JWKS_URI: ${INVENTORY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      PORT: 8080
    ports: ["${INVENTORY_SERVICE_PORT:-8083}:8080"]
    depends_on:
      inventory-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
volumes:
  inventory_db_data: {name: coffee_inventory_standalone_db_data}
