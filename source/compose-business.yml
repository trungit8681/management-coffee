name: coffee-business
services:
  catalog-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog_app
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
    volumes: [catalog_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U catalog_app -d catalog"], interval: 5s, timeout: 3s, retries: 10}
  order-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD}
    volumes: [order_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U order_app -d orders"], interval: 5s, timeout: 3s, retries: 10}
  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD}
    volumes: [payment_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U payment_app -d payment"], interval: 5s, timeout: 3s, retries: 10}
  catalog-service:
    build: ./services/catalog-service
    environment:
      CATALOG_DB_URL: "postgresql://catalog_app:${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}@catalog-db:5432/catalog"
      CATALOG_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PORT: 8080
    depends_on: {catalog-db: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 3s, retries: 10, start_period: 30s}
  order-service:
    build: ./services/order-service
    environment:
      ORDER_DB_URL: jdbc:postgresql://order-db:5432/orders
      ORDER_DB_USERNAME: order_app
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD}
      ORDER_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      ORDER_CATALOG_BASE_URL: http://catalog-service:8080/
      ORDER_PAYMENT_BASE_URL: http://payment-service:8080/
      PORT: 8080
    depends_on: {order-db: {condition: service_healthy}, catalog-service: {condition: service_healthy}}
  payment-service:
    build: ./services/payment-service
    environment:
      PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payment
      PAYMENT_DB_USERNAME: payment_app
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD}
      PAYMENT_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PAYMENT_ORDER_BASE_URL: http://order-service:8080/
      PORT: 8080
    depends_on: {payment-db: {condition: service_healthy}, order-service: {condition: service_started}}
  inventory-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
    volumes: [inventory_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory"], interval: 5s, timeout: 3s, retries: 10}
  inventory-service:
    build: ./services/inventory-service
    environment:
      INVENTORY_DB_URL: jdbc:postgresql://inventory-db:5432/inventory
      INVENTORY_DB_USERNAME: inventory_app
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Set INVENTORY_DB_PASSWORD}
      INVENTORY_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PORT: 8080
    depends_on: {inventory-db: {condition: service_healthy}}
  procurement-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement_app
      POSTGRES_PASSWORD: ${PROCUREMENT_DB_PASSWORD:?Set PROCUREMENT_DB_PASSWORD}
    volumes: [procurement_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U procurement_app -d procurement"], interval: 5s, timeout: 3s, retries: 10}
  procurement-service:
    build: ./services/procurement-service
    environment:
      PROCUREMENT_DB_URL: jdbc:postgresql://procurement-db:5432/procurement
      PROCUREMENT_DB_USERNAME: procurement_app
      PROCUREMENT_DB_PASSWORD: ${PROCUREMENT_DB_PASSWORD:?Set PROCUREMENT_DB_PASSWORD}
      PROCUREMENT_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PORT: 8080
    depends_on: {procurement-db: {condition: service_healthy}}
  loyalty-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: loyalty
      POSTGRES_USER: loyalty_app
      POSTGRES_PASSWORD: ${LOYALTY_DB_PASSWORD:?Set LOYALTY_DB_PASSWORD}
    volumes: [loyalty_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U loyalty_app -d loyalty"], interval: 5s, timeout: 3s, retries: 10}
  loyalty-service:
    build: ./services/loyalty-service
    environment:
      LOYALTY_DB_URL: jdbc:postgresql://loyalty-db:5432/loyalty
      LOYALTY_DB_USERNAME: loyalty_app
      LOYALTY_DB_PASSWORD: ${LOYALTY_DB_PASSWORD:?Set LOYALTY_DB_PASSWORD}
      LOYALTY_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PORT: 8080
    depends_on: {loyalty-db: {condition: service_healthy}}
  promotion-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promotion
      POSTGRES_USER: promotion_app
      POSTGRES_PASSWORD: ${PROMOTION_DB_PASSWORD:?Set PROMOTION_DB_PASSWORD}
    volumes: [promotion_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U promotion_app -d promotion"], interval: 5s, timeout: 3s, retries: 10}
  promotion-service:
    build: ./services/promotion-service
    environment:
      SERVICE_NAME: promotion
      PROMOTION_DB_URL: "postgresql://promotion_app:${PROMOTION_DB_PASSWORD:?Set PROMOTION_DB_PASSWORD}@promotion-db:5432/promotion"
      PROMOTION_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PORT: 8080
    depends_on: {promotion-db: {condition: service_healthy}}
  fulfillment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fulfillment
      POSTGRES_USER: fulfillment_app
      POSTGRES_PASSWORD: ${FULFILLMENT_DB_PASSWORD:?Set FULFILLMENT_DB_PASSWORD}
    volumes: [fulfillment_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U fulfillment_app -d fulfillment"], interval: 5s, timeout: 3s, retries: 10}
  fulfillment-service:
    build: ./services/fulfillment-service
    environment:
      SERVICE_NAME: fulfillment
      FULFILLMENT_DB_URL: "postgresql://fulfillment_app:${FULFILLMENT_DB_PASSWORD:?Set FULFILLMENT_DB_PASSWORD}@fulfillment-db:5432/fulfillment"
      FULFILLMENT_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      FULFILLMENT_ORDER_BASE_URL: http://order-service:8080/
      PORT: 8080
    depends_on: {fulfillment-db: {condition: service_healthy}, order-service: {condition: service_started}}
  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification_app
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD}
    volumes: [notification_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U notification_app -d notification"], interval: 5s, timeout: 3s, retries: 10}
  notification-service:
    build: ./services/notification-service
    environment:
      SERVICE_NAME: notification
      NOTIFICATION_DB_URL: "postgresql://notification_app:${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD}@notification-db:5432/notification"
      NOTIFICATION_JWKS_URI: "${IDENTITY_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}"
      PORT: 8080
    depends_on: {notification-db: {condition: service_healthy}}
  kong:
    image: kong:3.9.1
    environment: {KONG_DATABASE: "off", KONG_DECLARATIVE_CONFIG: /kong/business.yml, KONG_PROXY_LISTEN: "0.0.0.0:8000"}
    volumes: ["./kong/business.yml:/kong/business.yml:ro"]
    ports: ["${BUSINESS_GATEWAY_PORT:-8000}:8000"]
    depends_on: [catalog-service, order-service, payment-service, inventory-service, procurement-service, loyalty-service, promotion-service, fulfillment-service, notification-service]
volumes:
  catalog_data: {name: coffee_catalog_data}
  order_data: {name: coffee_order_data}
  payment_data: {name: coffee_payment_data}
  inventory_data: {name: coffee_inventory_data}
  procurement_data: {name: coffee_procurement_data}
  loyalty_data: {name: coffee_loyalty_data}
  promotion_data: {name: coffee_promotion_data}
  fulfillment_data: {name: coffee_fulfillment_data}
  notification_data: {name: coffee_notification_data}
