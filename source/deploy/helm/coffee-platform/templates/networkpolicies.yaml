{{- if .Values.networkPolicy.enabled }}
{{- range $name, $_ := .Values.databases }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ $name }}-db-ingress, namespace: {{ include "coffee.namespace" $ }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-db}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-service}}
        {{- if hasKey $.Values.relays $name }}
        - podSelector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-outbox-relay}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: rabbitmq-ingress, namespace: {{ include "coffee.namespace" . }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: rabbitmq}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: order-service}}
        - podSelector: {matchLabels: {app.kubernetes.io/component: outbox-relay}}
      ports: [{protocol: TCP, port: 5672}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-redis-ingress, namespace: {{ include "coffee.namespace" . }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: gateway-redis}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: kong}}}]
      ports: [{protocol: TCP, port: 6379}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-redis-ingress, namespace: {{ include "coffee.namespace" . }}}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: identity-redis}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: identity-service}}}]
      ports: [{protocol: TCP, port: 6379}]
{{- end }}

