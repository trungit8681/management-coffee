spring:
  application.name: inventory-service
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5440/inventory}
    username: ${INVENTORY_DB_USERNAME:inventory_app}
    password: ${INVENTORY_DB_PASSWORD:admin1234}
  flyway: {enabled: true, locations: classpath:db/migration}
server: {port: "${PORT:${INVENTORY_SERVICE_PORT:8083}}", shutdown: graceful}
inventory:
  jwt:
    issuer: ${INVENTORY_JWT_ISSUER:coffee-identity}
    audience: ${INVENTORY_JWT_AUDIENCE:coffee-platform}
    jwks-uri: ${INVENTORY_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    jwks-cache-ttl: ${INVENTORY_JWKS_CACHE_TTL:PT5M}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
