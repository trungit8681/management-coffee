spring:
  application.name: procurement-service
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${PROCUREMENT_DB_URL:jdbc:postgresql://localhost:5441/procurement}
    username: ${PROCUREMENT_DB_USERNAME:procurement_app}
    password: ${PROCUREMENT_DB_PASSWORD:admin1234}
  flyway: {enabled: true, locations: classpath:db/migration}
server: {port: "${PORT:${PROCUREMENT_SERVICE_PORT:8084}}", shutdown: graceful}
procurement:
  jwt:
    issuer: ${PROCUREMENT_JWT_ISSUER:coffee-identity}
    audience: ${PROCUREMENT_JWT_AUDIENCE:coffee-platform}
    jwks-uri: ${PROCUREMENT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    jwks-cache-ttl: ${PROCUREMENT_JWKS_CACHE_TTL:PT5M}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
