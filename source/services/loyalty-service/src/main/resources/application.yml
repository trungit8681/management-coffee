spring:
  application.name: loyalty-service
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${LOYALTY_DB_URL:jdbc:postgresql://localhost:5442/loyalty}
    username: ${LOYALTY_DB_USERNAME:loyalty_app}
    password: ${LOYALTY_DB_PASSWORD:admin1234}
  flyway: {enabled: true, locations: classpath:db/migration}
server: {port: "${PORT:${LOYALTY_SERVICE_PORT:8087}}", shutdown: graceful}
loyalty:
  jwt:
    issuer: ${LOYALTY_JWT_ISSUER:coffee-identity}
    audience: ${LOYALTY_JWT_AUDIENCE:coffee-platform}
    jwks-uri: ${LOYALTY_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    jwks-cache-ttl: ${LOYALTY_JWKS_CACHE_TTL:PT5M}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
