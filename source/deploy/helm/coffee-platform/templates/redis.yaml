{{- range $name, $cfg := dict "identity-redis" .Values.identityRedis "gateway-redis" .Values.gatewayRedis }}
---
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}, namespace: {{ include "coffee.namespace" $ }}, labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: coffee-platform}}
spec: {selector: {app.kubernetes.io/name: {{ $name }}}, ports: [{name: redis, port: 6379, targetPort: redis}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: {{ $name }}, namespace: {{ include "coffee.namespace" $ }}}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: coffee-platform}}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: initialize-data-permissions
          image: {{ $cfg.image }}
          command: [sh, -c, "chown -R 999:1000 /data"]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [CHOWN]}}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: redis
          image: {{ $cfg.image }}
          args: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
          ports: [{name: redis, containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {exec: {command: [redis-cli, ping]}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 3}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        {{- include "coffee.storageClass" $ | nindent 8 }}
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ $cfg.size }}}}
{{- end }}

