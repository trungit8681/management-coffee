_format_version: "3.0"
_transform: true

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  - name: request-size-limiting
    config:
      allowed_payload_size: 1

services:
  - name: identity-auth
    url: http://host.docker.internal:8080
    retries: 0
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: identity-auth-api
        paths: ["/api/v1/auth"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: {minute: 30, policy: local}

  - name: identity
    url: http://host.docker.internal:8080
    retries: 0
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: identity-api
        paths: ["/api/v1/identity"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: {minute: 120, policy: local}

  - name: organization
