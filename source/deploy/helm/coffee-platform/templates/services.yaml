{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ $name }}-service, namespace: {{ include "coffee.namespace" $ }}}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
  namespace: {{ include "coffee.namespace" $ }}
  labels: {app.kubernetes.io/name: {{ $name }}-service, app.kubernetes.io/part-of: coffee-platform}
spec:
  selector: {app.kubernetes.io/name: {{ $name }}-service}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  namespace: {{ include "coffee.namespace" $ }}
  labels: {app.kubernetes.io/name: {{ $name }}-service, app.kubernetes.io/part-of: coffee-platform}
spec:
  replicas: {{ $.Values.global.replicas }}
  revisionHistoryLimit: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-service}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ $name }}-service, app.kubernetes.io/part-of: coffee-platform}}
    spec:
      serviceAccountName: {{ $name }}-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ if eq $svc.runtime "java" }}10001{{ else }}1000{{ end }}
        runAsGroup: {{ if eq $svc.runtime "java" }}999{{ else }}1000{{ end }}
        seccompProfile: {type: RuntimeDefault}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: {{ $.Values.global.imageRegistry }}/{{ $name }}-service:{{ $.Values.global.imageTag }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: PORT, value: "8080"}
            {{- range $envName, $env := $svc.env }}
            - name: {{ $envName }}
              {{- if hasKey $env "secret" }}
              valueFrom: {secretKeyRef: {name: {{ $.Values.secretName }}, key: {{ $env.secret }}}}
              {{- else }}
              value: {{ $env.value | quote }}
              {{- end }}
            {{- end }}
          startupProbe: {httpGet: {path: {{ $svc.healthBase }}/{{ $svc.live }}, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 30}
          readinessProbe: {httpGet: {path: {{ $svc.healthBase }}/{{ $svc.ready }}, port: http}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: {{ $svc.healthBase }}/{{ $svc.live }}, port: http}, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          lifecycle: {preStop: {exec: {command: [sh, -c, sleep 10]}}}
          resources:
            {{- if eq $svc.runtime "java" }}{{ toYaml $.Values.global.javaResources | nindent 12 }}{{ else }}{{ toYaml $.Values.global.nodeResources | nindent 12 }}{{ end }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if $svc.jwtVolume }}
            - {name: jwt-keys, mountPath: /var/lib/identity/keys, readOnly: true}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if $svc.jwtVolume }}
        - {name: jwt-keys, secret: {secretName: {{ $.Values.jwtSecretName }}}}
        {{- end }}
{{- if $.Values.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: {{ $name }}-service, namespace: {{ include "coffee.namespace" $ }}}
spec: {minAvailable: {{ $.Values.pdb.minAvailable }}, selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-service}}}
{{- end }}
{{- if $.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ $name }}-service, namespace: {{ include "coffee.namespace" $ }}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}-service}
  minReplicas: {{ $.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $.Values.autoscaling.maxReplicas }}
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}, scaleUp: {stabilizationWindowSeconds: 30}}
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ $.Values.autoscaling.cpuUtilization }}}}}]
{{- end }}
{{- end }}

