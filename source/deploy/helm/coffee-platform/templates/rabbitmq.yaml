apiVersion: v1
kind: Service
metadata: {name: rabbitmq, namespace: {{ include "coffee.namespace" . }}, labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: coffee-platform}}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: rabbitmq}
  ports: [{name: amqp, port: 5672, targetPort: amqp}, {name: management, port: 15672, targetPort: management}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: rabbitmq, namespace: {{ include "coffee.namespace" . }}}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: rabbitmq}}
  template:
    metadata: {labels: {app.kubernetes.io/name: rabbitmq, app.kubernetes.io/part-of: coffee-platform}}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: {fsGroup: 101, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: initialize-data-permissions
          image: {{ .Values.rabbitmq.image }}
          command: [sh, -c, "chown -R 100:101 /var/lib/rabbitmq"]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [CHOWN]}}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
      containers:
        - name: rabbitmq
          image: {{ .Values.rabbitmq.image }}
          ports: [{name: amqp, containerPort: 5672}, {name: management, containerPort: 15672}]
          env:
            - {name: RABBITMQ_DEFAULT_USER, valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: RABBITMQ_USER}}}
            - {name: RABBITMQ_DEFAULT_PASS, valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: RABBITMQ_PASSWORD}}}
            - {name: RABBITMQ_ERLANG_COOKIE, valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: RABBITMQ_ERLANG_COOKIE}}}
          readinessProbe: {exec: {command: [rabbitmq-diagnostics, -q, check_running]}, initialDelaySeconds: 15, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          livenessProbe: {exec: {command: [rabbitmq-diagnostics, -q, ping]}, initialDelaySeconds: 30, periodSeconds: 20, timeoutSeconds: 5}
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: "1", memory: 1Gi}}
          securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        {{- include "coffee.storageClass" . | nindent 8 }}
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ .Values.rabbitmq.size }}}}

