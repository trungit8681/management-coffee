spring:
  application.name: order-service
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5438/orders}
    username: ${ORDER_DB_USERNAME:order_app}
    password: ${ORDER_DB_PASSWORD:admin1234}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:${ORDER_SERVICE_PORT:8086}}
  shutdown: graceful
order:
  catalog-base-url: ${ORDER_CATALOG_BASE_URL:http://localhost:8082/}
  payment-base-url: ${ORDER_PAYMENT_BASE_URL:http://localhost:8085/}
  jwt:
    issuer: ${ORDER_JWT_ISSUER:coffee-identity}
    audience: ${ORDER_JWT_AUDIENCE:coffee-platform}
    jwks-uri: ${ORDER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    jwks-cache-ttl: ${ORDER_JWKS_CACHE_TTL:PT5M}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
