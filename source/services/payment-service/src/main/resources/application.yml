spring:
  application.name: payment-service
  autoconfigure.exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5439/payment}
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD:admin1234}
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${PORT:${PAYMENT_SERVICE_PORT:8085}}
  shutdown: graceful
payment:
  order-base-url: ${PAYMENT_ORDER_BASE_URL:http://localhost:8086/}
  jwt:
    issuer: ${PAYMENT_JWT_ISSUER:coffee-identity}
    audience: ${PAYMENT_JWT_AUDIENCE:coffee-platform}
    jwks-uri: ${PAYMENT_JWKS_URI:http://localhost:8080/.well-known/jwks.json}
    jwks-cache-ttl: ${PAYMENT_JWKS_CACHE_TTL:PT5M}
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
