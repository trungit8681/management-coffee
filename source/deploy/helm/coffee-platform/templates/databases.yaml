{{- range $name, $db := .Values.databases }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-db
  namespace: {{ include "coffee.namespace" $ }}
  labels: {app.kubernetes.io/name: {{ $name }}-db, app.kubernetes.io/component: database, app.kubernetes.io/part-of: coffee-platform}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: {{ $name }}-db}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}-db
  namespace: {{ include "coffee.namespace" $ }}
  labels: {app.kubernetes.io/name: {{ $name }}-db, app.kubernetes.io/component: database, app.kubernetes.io/part-of: coffee-platform}
spec:
  serviceName: {{ $name }}-db
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-db}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ $name }}-db, app.kubernetes.io/component: database, app.kubernetes.io/part-of: coffee-platform}}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext: {fsGroup: 70, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: initialize-data-permissions
          image: {{ $.Values.postgres.image }}
          command: [sh, -c, "chown -R 70:70 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          securityContext: {runAsUser: 0, allowPrivilegeEscalation: false, capabilities: {drop: [ALL], add: [CHOWN, FOWNER]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: {{ $db.database | quote }}}
            - {name: POSTGRES_USER, value: {{ $db.user | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $.Values.secretName }}, key: {{ upper $name }}_DB_PASSWORD}}
          readinessProbe: {exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 3}
          livenessProbe: {exec: {command: [sh, -c, "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]}, initialDelaySeconds: 20, periodSeconds: 10, timeoutSeconds: 3}
          resources: {{ toYaml $.Values.postgres.resources | nindent 12 }}
          securityContext: {runAsNonRoot: true, runAsUser: 70, runAsGroup: 70, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        {{- include "coffee.storageClass" $ | nindent 8 }}
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: {{ $db.size }}}}
{{- end }}

