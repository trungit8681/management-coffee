apiVersion: v1
kind: ServiceAccount
metadata: {name: outbox-relay, namespace: {{ include "coffee.namespace" . }}}
automountServiceAccountToken: false
{{- range $name, $relay := .Values.relays }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ $name }}-outbox-relay, namespace: {{ include "coffee.namespace" $ }}, labels: {app.kubernetes.io/name: {{ $name }}-outbox-relay, app.kubernetes.io/part-of: coffee-platform}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: {{ $name }}-outbox-relay}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ $name }}-outbox-relay, app.kubernetes.io/component: outbox-relay, app.kubernetes.io/part-of: coffee-platform}}
    spec:
      serviceAccountName: outbox-relay
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: relay
          image: {{ $.Values.global.imageRegistry }}/outbox-relay:{{ $.Values.global.imageTag }}
          env:
            - name: EVENT_SOURCE
              value: {{ printf "%s-service" $name | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.secretName }}, key: {{ $relay.databaseUrlKey }}}
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef: {name: {{ $.Values.secretName }}, key: RABBITMQ_URL}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 20, timeoutSeconds: 3}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 192Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
{{- end }}

