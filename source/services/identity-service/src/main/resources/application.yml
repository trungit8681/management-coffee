spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5433/identity}
    username: ${IDENTITY_DB_USERNAME:identity_app}
    password: ${IDENTITY_DB_PASSWORD:admin1234}
    hikari:
      maximum-pool-size: ${IDENTITY_DB_POOL_SIZE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  data:
    redis:
      host: ${IDENTITY_REDIS_HOST:localhost}
      port: ${IDENTITY_REDIS_PORT:6379}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful

identity:
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:coffee-identity}
    audience: ${IDENTITY_JWT_AUDIENCE:coffee-platform}
    key-id: ${IDENTITY_JWT_KEY_ID:local-dev-1}
    private-key-path: ${IDENTITY_JWT_PRIVATE_KEY_PATH:}
    public-key-path: ${IDENTITY_JWT_PUBLIC_KEY_PATH:}
    generate-if-missing: ${IDENTITY_JWT_GENERATE_IF_MISSING:true}
    access-ttl: ${IDENTITY_ACCESS_TOKEN_TTL:PT15M}
    refresh-ttl: ${IDENTITY_REFRESH_TOKEN_TTL:P30D}
  login:
    max-failures: ${IDENTITY_LOGIN_MAX_FAILURES:5}
    lock-duration: ${IDENTITY_LOGIN_LOCK_DURATION:PT15M}
  bootstrap:
    username: ${IDENTITY_BOOTSTRAP_ADMIN_USERNAME:superadmin}
    password: ${IDENTITY_BOOTSTRAP_ADMIN_PASSWORD:admin123456789}
    display-name: ${IDENTITY_BOOTSTRAP_ADMIN_DISPLAY_NAME:System Administrator}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
