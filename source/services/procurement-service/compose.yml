name: coffee-procurement
services:
  procurement-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement_app
      POSTGRES_PASSWORD: ${PROCUREMENT_DB_PASSWORD:-admin1234}
    ports: ["${PROCUREMENT_DB_PORT:-5441}:5432"]
    volumes: [procurement_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement_app -d procurement"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
  procurement-service:
    build: {context: ., dockerfile: Dockerfile}
    environment:
      PROCUREMENT_DB_URL: jdbc:postgresql://procurement-db:5432/procurement
      PROCUREMENT_DB_USERNAME: procurement_app
      PROCUREMENT_DB_PASSWORD: ${PROCUREMENT_DB_PASSWORD:-admin1234}
      PROCUREMENT_JWKS_URI: ${PROCUREMENT_JWKS_URI:-http://host.docker.internal:8080/.well-known/jwks.json}
      PORT: 8080
    ports: ["${PROCUREMENT_SERVICE_PORT:-8084}:8080"]
    depends_on:
      procurement-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
volumes:
  procurement_db_data: {name: coffee_procurement_standalone_db_data}
