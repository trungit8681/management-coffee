apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coffee-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/trungit8681/management-coffee.git
    targetRevision: main
    path: source/deploy/helm/coffee-platform
    helm:
      valueFiles: [values.yaml, values-production.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: coffee-platform
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
  revisionHistoryLimit: 10

