_format_version: "3.0"
_transform: true

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  - name: cors
    config:
      origins: ["http://localhost:3000", "http://localhost:5173"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Authorization", "Content-Type", "Idempotency-Key", "If-Match", "X-Correlation-ID"]
      exposed_headers: ["X-Correlation-ID", "RateLimit-Limit", "RateLimit-Remaining", "RateLimit-Reset"]
      credentials: true
      max_age: 3600
  - name: request-size-limiting
    config: {allowed_payload_size: 1}

services:
  - name: catalog
    url: http://catalog-service:8080
    retries: 0
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: catalog-api
        paths: ["/api/v1/catalog"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: {minute: 120, policy: redis, redis_host: gateway-redis, redis_port: 6379, redis_database: 1}
  - name: orders
    url: http://order-service:8080
    retries: 0
    connect_timeout: 3000
